name: .NET CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup .NET 10 SDK with NuGet package caching
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    # 3. Restore dependencies across all solution projects
    - name: Restore Dependencies
      run: dotnet restore EmployeeManagement.slnx

    # 4. Build solution in Release configuration (verifies compile & zero warnings)
    - name: Build Solution
      run: dotnet build EmployeeManagement.slnx --configuration Release --no-restore

    # 5. Execute all unit and integration tests
    - name: Run Tests
      run: dotnet test EmployeeManagement.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

    # 6. Upload test results artifact (optional: allows viewing test runs in GitHub Actions UI)
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/*.trx'
        retention-days: 7
